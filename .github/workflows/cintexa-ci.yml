name: CINTEXA build verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/seo-editorial-site"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build production workspaces
        run: npm run build
      - name: Run type checks
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Run lint
        run: npm run lint
