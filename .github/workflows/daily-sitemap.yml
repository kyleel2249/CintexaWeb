name: Daily sitemap refresh

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-sitemap
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate sitemap
        run: node artifacts/cintexa/scripts/generate-sitemap.mjs
      - name: Commit daily sitemap update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/cintexa/public/sitemap.xml
          if git diff --cached --quiet; then
            echo "Sitemap is already current."
          else
            git commit -m "chore(seo): refresh sitemap daily"
            git push origin HEAD:main
          fi
