# Cloudflare Pages configuration.
#
# This repo is a monorepo — the deployable frontend lives in
# artifacts/cintexa/, not at the repo root. If Cloudflare Pages' dashboard
# build settings are left at their defaults, it looks for a build at the repo
# root, finds nothing to build, and serves nothing (or a stale/empty
# result) — which is what "changes aren't reflecting" usually means.
#
# Recommended Cloudflare Pages dashboard settings (Settings > Builds & deployments):
#   Framework preset:        Vite
#   Root directory:          / (repo root — leave as default)
#   Build command:           npm install && npm run build -w @cintexa/db && npm run build -w cintexa
#   Build output directory:  artifacts/cintexa/dist
#   Node version:             22 (set NODE_VERSION env var if the build picks an older default)
#
# See DEPLOYMENT.md for the full walkthrough, including required environment
# variables (VITE_CLERK_PUBLISHABLE_KEY, VITE_API_BASE_URL).

name = "cintexa-growth-platform"
pages_build_output_dir = "artifacts/cintexa/dist"
compatibility_date = "2026-01-01"
