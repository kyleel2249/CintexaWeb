# Cloudflare Pages — monorepo frontend output
#
# Dashboard → Settings → Builds & deployments MUST be:
#   Framework preset:       Vite (or None)
#   Root directory:         /  (repo root)
#   Build command:          npm ci && npm run build:pages
#   Build output directory: artifacts/cintexa/dist
#   Environment variable:   NODE_VERSION=22
#
# If Build output directory is left as "dist" or ".", Cloudflare serves an
# empty project → HTTP 404 on https://cintexa.com

name = "cintexa-growth-platform"
pages_build_output_dir = "artifacts/cintexa/dist"
compatibility_date = "2026-01-01"
