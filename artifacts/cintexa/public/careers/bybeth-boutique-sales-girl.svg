<text x="56" y="236" font-family="Georgia,serif" font-size="46" fill="#512345">WE ARE</text><text x="50" y="337" font-family="Georgia,serif" font-weight="bold" font-size="100" fill="#512345">HIRING</text><path d="M58 358H550" stroke="#b78eb7" stroke-width="3"/>
