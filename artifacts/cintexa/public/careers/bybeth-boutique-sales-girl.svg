<rect x="48" y="478" width="754" height="110" rx="22" fill="#e9d9e8"/><circle cx="100" cy="530" r="27" fill="#512345"/><path d="M100 510v40M80 530h40" stroke="#fff" stroke-width="6" stroke-linecap="round"/><text x="150" y="519" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#512345">LOCATION PREFERENCE</text><text x="150" y="558" font-family="Arial,sans-serif" font-size="25" fill="#512345">East Legon, Madina &amp; nearby areas</text>
<text x="55" y="646" font-family="Arial,sans-serif" font-size="25" fill="#342333">Love fashion and helping people? ByBeth Boutique</text><text x="55" y="681" font-family="Arial,sans-serif" font-size="25" fill="#342333">is looking for a friendly, reliable and energetic</text><text x="55" y="716" font-family="Arial,sans-serif" font-size="25" fill="#342333">Sales Girl who enjoys excellent customer service.</text>
<rect x="42" y="750" width="766" height="310" rx="24" fill="#fff" stroke="#e0c9df" stroke-width="2"/><text x="75" y="802" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#512345">WHAT YOU'LL DO</text>
<g font-family="Arial,sans-serif" font-size="23" fill="#342333"><circle cx="83" cy="845" r="7" fill="#7e4c7c"/><text x="105" y="853">Welcome customers and provide great service</text><circle cx="83" cy="889" r="7" fill="#7e4c7c"/><text x="105" y="897">Support sales, packing and product presentation</text><circle cx="83" cy="933" r="7" fill="#7e4c7c"/><text x="105" y="941">Keep the boutique neat, organised and stocked</text><circle cx="83" cy="977" r="7" fill="#7e4c7c"/><text x="105" y="985">Assist with stock receiving and inventory checks</text><circle cx="83" cy="1021" r="7" fill="#7e4c7c"/><text x="105" y="1029">Promote the brand and a positive shopping experience</text></g>
<text x="55" y="1105" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#512345">WE'RE LOOKING FOR SOMEONE WHO IS</text><text x="55" y="1145" font-family="Arial,sans-serif" font-size="22" fill="#342333">Friendly • Honest • Dependable • A good communicator</text><text x="55" y="1180" font-family="Arial,sans-serif" font-size="22" fill="#342333">Retail experience is an advantage; flexible hours needed.</text>
